name: Auto Merge Bot PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto Merge Dependabot & Release PRs
    runs-on: ubuntu-latest
    if: |
      github.actor == 'dependabot[bot]' ||
      github.actor == 'google-github-actions-release-please[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending') ||
      contains(github.event.pull_request.labels.*.name, 'dependencies')
    steps:
      - name: Dependabot metadata
        if: github.actor == 'dependabot[bot]'
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-approve and Auto-merge Dependabot PRs
        if: github.actor == 'dependabot[bot]'
        run: |
          gh pr review "$PR_URL" --approve -b "🤖 Dependabot bump approved." || echo "Already approved or cannot approve"
          gh pr merge "$PR_URL" --auto --squash || echo "Auto-merge flag set or pending"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge Release-Please PRs
        if: github.actor != 'dependabot[bot]'
        run: |
          gh pr merge "$PR_URL" --auto --squash || echo "Auto-merge flag set or pending"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

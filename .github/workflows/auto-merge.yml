name: Auto Merge Bot PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto Merge Dependabot & Release PRs
    runs-on: ubuntu-latest
    if: |
      github.actor == 'dependabot[bot]' ||
      github.actor == 'google-github-actions-release-please[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending') ||
      contains(github.event.pull_request.labels.*.name, 'dependencies')
    steps:
      - name: Approve PR
        run: |
          gh pr review "$PR_URL" --approve --body "🤖 Automated verification passed. Auto-approving PR for automated merge."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Auto-Merge
        run: |
          gh pr merge --auto --squash "$PR_URL" || echo "Note: Ensure 'Allow auto-merge' is enabled in repo settings"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

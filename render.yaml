services:
  - type: web
    name: hotel-booking-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: PORT
        value: 6969
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
